# Cut a release: git tag v0.1.0 && git push --tags
# Builds all four binaries (bun cross-compiles from one runner) and attaches
# them to the GitHub release, which the install one-liners download.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write # npm provenance attestation (OIDC)
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # secrets context is not allowed in step-level `if:` — expose presence
      # as a job env var and gate the npm steps on that instead.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun x tsc --noEmit
      - run: bun run dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
      # Auto-publish to npm when the NPM_TOKEN repo secret is configured
      # (granular access token with 2FA bypass). Without the secret this
      # step is skipped and the release still succeeds.
      - uses: actions/setup-node@v4
        if: env.HAS_NPM_TOKEN == 'true'
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      # --provenance links the published package to this exact commit + workflow
      # run (Sigstore attestation) — verifiable on npm and scored by Socket.
      - run: npm publish --provenance
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
